<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Counterset — clash desk</title>
    <link rel="stylesheet" href="/web/studio.css" />
    <link rel="icon" href="/web/assets/icon.svg" type="image/svg+xml" />
    <script src="/web/studio.js" type="module"></script>
  </head>
  <body data-mode="walk">
    <a class="skip" href="#grid">Skip to the timetable</a>
    <header class="bar">
      <a class="mark" href="/">Counterset</a>
      <div class="bar-day">
        <strong id="day-name">Loading…</strong>
        <span id="day-meta"></span>
      </div>
      <button id="open-day" class="bar-btn" aria-haspopup="dialog">Open a day</button>
      <div class="mode" role="group" aria-label="Interface mode">
        <button id="mode-walk" aria-pressed="true">Walkthrough</button
        ><button id="mode-desk" aria-pressed="false">Desk</button>
      </div>
      <button id="tools" class="bar-btn" aria-haspopup="menu" aria-expanded="false">Tools</button>
      <div id="tools-menu" class="menu" role="menu" hidden>
        <button role="menuitem" id="edit-json">Edit facts (JSON)</button>
        <label role="menuitem" class="menu-file">Import a day<input type="file" id="import" accept="application/json" /></label>
        <button role="menuitem" id="compare">Compare evidence</button>
        <button role="menuitem" id="shortcuts">Keyboard shortcuts</button>
        <button role="menuitem" id="auth">Access token</button>
      </div>
    </header>

    <main class="desk" data-ui>
      <aside class="sheet" aria-label="Run sheet">
        <ol id="chapters" class="chapters"></ol>
      </aside>

      <section class="stagefloor" aria-label="Timetable">
        <div class="floor-head">
          <div id="views" class="views" role="tablist" aria-label="Which timetable to show"></div>
          <div id="legend" class="legend"></div>
        </div>
        <div id="context" class="context"></div>
        <div class="grid-wrap" id="grid-wrap">
          <div id="grid" class="grid" tabindex="-1"></div>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <section id="inspector" class="inspector" aria-live="polite"></section>
      </section>
    </main>

    <div id="busy" class="busy" hidden>
      <span id="busy-label">Working…</span>
      <progress id="progress" max="1" value="0"></progress>
    </div>

    <dialog id="dialog" aria-labelledby="dialog-title">
      <form method="dialog" id="dialog-form">
        <header class="dialog-head">
          <h2 id="dialog-title"></h2>
          <button value="cancel" class="ghost" id="dialog-close" aria-label="Close">Close</button>
        </header>
        <div id="dialog-body"></div>
      </form>
    </dialog>
  </body>
</html>
